<!DOCTYPE html><html lang="vi"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Cài đặt - CoinTap</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#faf8ff",
                        "secondary-container": "#8a4cfc",
                        "warning": "#F59E0B",
                        "border-subtle": "#E2E8F0",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f2f3ff",
                        "on-tertiary-fixed": "#360f00",
                        "surface-container-highest": "#dae2fd",
                        "on-primary": "#ffffff",
                        "surface-tint": "#0053db",
                        "primary-fixed": "#dbe1ff",
                        "on-primary-fixed-variant": "#003ea8",
                        "outline-variant": "#c3c6d7",
                        "on-secondary-container": "#fffbff",
                        "success": "#10B981",
                        "on-primary-fixed": "#00174b",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "inverse-on-surface": "#eef0ff",
                        "outline": "#737686",
                        "on-surface-variant": "#434655",
                        "secondary-fixed": "#eaddff",
                        "primary-container": "#2563eb",
                        "secondary": "#712ae2",
                        "tertiary-container": "#bc4800",
                        "on-primary-container": "#eeefff",
                        "surface-container-high": "#e2e7ff",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "secondary-fixed-dim": "#d2bbff",
                        "on-tertiary-container": "#ffede6",
                        "surface-alt": "#F8FAFC",
                        "on-background": "#131b2e",
                        "on-secondary-fixed": "#25005a",
                        "tertiary-fixed-dim": "#ffb596",
                        "primary": "#2563eb", /* Overridden to match prompt requirement #2563eb as primary */
                        "primary-fixed-dim": "#b4c5ff",
                        "background": "#faf8ff",
                        "inverse-primary": "#b4c5ff",
                        "on-secondary-fixed-variant": "#5a00c6",
                        "tertiary-fixed": "#ffdbcd",
                        "on-surface": "#131b2e",
                        "surface-variant": "#dae2fd",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#283044",
                        "surface-dim": "#d2d9f4",
                        "surface": "#ffffff", /* Ensuring surface is pure white for minimalism */
                        "error": "#EF4444",
                        "on-error-container": "#93000a",
                        "on-secondary": "#ffffff",
                        "surface-container": "#eaedff",
                        "tertiary": "#943700"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "12px",
                        "section-padding": "32px",
                        "stack-sm": "4px",
                        "gutter": "16px",
                        "stack-lg": "24px",
                        "base": "8px",
                        "margin-mobile": "20px"
                    },
                    "fontFamily": {
                        "label-caps": ["Manrope", "sans-serif"],
                        "body-sm": ["Manrope", "sans-serif"],
                        "display-lg-mobile": ["Manrope", "sans-serif"],
                        "body-lg": ["Manrope", "sans-serif"],
                        "numeric-data": ["Manrope", "sans-serif"],
                        "display-lg": ["Manrope", "sans-serif"],
                        "headline-md": ["Manrope", "sans-serif"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "numeric-data": ["18px", { "lineHeight": "24px", "fontWeight": "500" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface h-screen w-full flex flex-col md:hidden">
<!-- TopAppBar from JSON -->
<header class="docked full-width top-0 bg-surface dark:bg-on-background flat no shadows flex items-center w-full px-margin-mobile h-16 max-w-full z-10 sticky">
<button aria-label="Back" class="hover:opacity-80 transition-opacity active:scale-95 transition-transform flex-shrink-0 flex items-center justify-center p-2 -ml-2 text-primary dark:text-primary-fixed">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex-1 text-center pr-8">
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">Đổi mật khẩu</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-margin-mobile pt-stack-lg pb-[100px] overflow-y-auto">
<!-- Form Container -->
<div class="flex flex-col gap-stack-lg flex-1">
<!-- Current Password -->
<div class="flex flex-col gap-stack-sm relative">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="current-password">Mật khẩu hiện tại</label>
<div class="relative w-full">
<input class="w-full bg-surface-alt border border-border-subtle rounded-lg px-4 py-3 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="current-password" placeholder="Nhập mật khẩu hiện tại" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors toggle-password" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- New Password -->
<div class="flex flex-col gap-stack-sm relative">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="new-password">Mật khẩu mới</label>
<div class="relative w-full">
<input class="w-full bg-surface-alt border border-border-subtle rounded-lg px-4 py-3 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="new-password" placeholder="Nhập mật khẩu mới" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors toggle-password" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Confirm New Password -->
<div class="flex flex-col gap-stack-sm relative">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="confirm-password">Xác nhận mật khẩu mới</label>
<div class="relative w-full">
<input class="w-full bg-surface-alt border border-border-subtle rounded-lg px-4 py-3 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="confirm-password" placeholder="Nhập lại mật khẩu mới" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors toggle-password" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Security Note -->
<div class="flex items-start gap-2 bg-surface-container-low p-4 rounded-xl">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="info">info</span>
<p class="font-body-sm text-body-sm text-on-surface-variant">Mật khẩu phải có ít nhất 8 ký tự.</p>
</div>
 <!-- Spacer to push button to bottom if content is short -->
<!-- Action Button -->
<button class="w-full bg-primary hover:opacity-90 active:scale-[0.98] transition-all duration-200 text-on-primary font-headline-md text-headline-md py-4 rounded-xl shadow-sm">
                Cập nhật mật khẩu
            </button>
</div>
</main>
<!-- Contextual Logic: Hide BottomNav on Sub-pages like "Change Password" (Task-Focused / Settings Sub-page) -->
<!-- The prompt implies this is a specific settings screen with a back button, so global nav should be suppressed to prioritize the Canvas. -->
<script>
        // Password Visibility Toggle Logic
        document.querySelectorAll('.toggle-password').forEach(button => {
            button.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const icon = this.querySelector('.material-symbols-outlined');
                
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility_off';
                    icon.setAttribute('data-icon', 'visibility_off');
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility';
                    icon.setAttribute('data-icon', 'visibility');
                }
            });
        });
    </script>


</body></html>
