</div>
<!-- Avatar Section -->
<div class="flex justify-center mb-stack-lg"><div class="relative mb-stack-lg">
<div class="w-32 h-32 rounded-full border-4 border-surface shadow-sm overflow-hidden bg-surface-variant">

<div class="flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="fullName">Họ và tên</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline" data-icon="person">person</span>
<input class="w-full bg-surface-alt border border-border-subtle rounded-lg py-3 pl-10 pr-4 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="fullName" type="text" value="Nam">
</div>
</div>
<!-- Input: Email -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="email">Email</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline" data-icon="mail">mail</span>
<input class="w-full bg-surface-alt border border-border-subtle rounded-lg py-3 pl-10 pr-4 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email" type="email" value="nam@example.com">
</div>
</div>

<div class="flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="phone">Số điện thoại</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline" data-icon="call">call</span>
<input class="w-full bg-surface-alt border border-border-subtle rounded-lg py-3 pl-10 pr-4 font-numeric-data text-numeric-data text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="phone" type="tel" value="0901234567">
</div>
</div>
<!-- Save Button (Prominent Bottom) -->
<div class="pt-stack-md mt-stack-lg">
<button class="w-full bg-primary text-on-primary font-headline-md text-headline-md py-4 rounded-xl shadow-md hover:bg-opacity-90 active:scale-[0.98] transition-all flex justify-center items-center gap-2" type="button">
<span class="material-symbols-outlined" data-icon="save">save</span>
