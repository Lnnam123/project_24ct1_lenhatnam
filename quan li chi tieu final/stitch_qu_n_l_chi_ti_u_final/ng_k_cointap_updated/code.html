<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign Up - CoinTap</title>
<!-- Material Symbols -->

                        "surface-variant": "#dae2fd",
                        "surface-alt": "#F8FAFC",
                        "on-secondary-container": "#fffbff",
                        "on-surface": "#131b2e",
                        "secondary-fixed": "#eaddff",
                        "surface-container-low": "#f2f3ff",
                        "on-secondary-fixed": "#25005a",
                        "on-secondary-fixed-variant": "#5a00c6",

                        "body-xs": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],

<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background min-h-screen flex flex-col antialiased">
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-margin-mobile pt-[80px] pb-stack-lg max-w-md mx-auto w-full">
<!-- Typography Header -->
<div class="mb-8 text-center mt-8">
<h1 class="text-display-lg-mobile font-display-lg-mobile text-on-surface mb-2 tracking-tight">Sign Up</h1>
<p class="text-body-sm font-body-sm text-on-surface-variant">Start your journey to better budgeting.</p>
</div>
<!-- Registration Form -->
<form action="#" class="flex flex-col gap-5 mt-4" method="POST">
<!-- Full Name Input -->
<div class="flex flex-col gap-1.5">
<label class="text-body-sm font-medium text-on-surface" for="fullname">Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant text-[20px]" data-icon="person">person</span>
<input class="w-full bg-surface-container-lowest border border-border-subtle rounded-lg pl-11 pr-4 py-3 text-body-sm font-body-sm text-on-surface placeholder:text-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="fullname" name="fullname" placeholder="Daniel Smith" type="text"/>
</div>
</div>
<!-- Email Input -->
<div class="flex flex-col gap-1.5">
<label class="text-body-sm font-medium text-on-surface" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant text-[20px]" data-icon="mail">mail</span>
<input class="w-full bg-surface-container-lowest border border-border-subtle rounded-lg pl-11 pr-4 py-3 text-body-sm font-body-sm text-on-surface placeholder:text-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="email" name="email" placeholder="daniel.smith@gmail.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1.5">
<label class="text-body-sm font-medium text-on-surface" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant text-[20px]" data-icon="lock">lock</span>
<input class="w-full bg-surface-container-lowest border border-border-subtle rounded-lg pl-11 pr-11 py-3 text-body-sm font-body-sm text-on-surface placeholder:text-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="password" name="password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
<p class="text-body-xs text-outline-variant mt-1">At least 8 characters</p>
</div>
<!-- Actions -->
<div class="mt-4 flex flex-col gap-4">
<p class="text-body-xs text-outline text-center mb-1">
    By signing up, you agree to our <a class="text-primary hover:underline" href="#">Terms of Use</a> &amp; <a class="text-primary hover:underline" href="#">Privacy Policy</a>.
</p>
<button class="w-full bg-[#1967d2] text-on-primary py-3.5 rounded-lg text-body-sm font-semibold shadow-sm hover:opacity-90 active:scale-[0.98] transition-all duration-200" type="submit">
    Sign Up
</button>
</div>
<!-- Social Sign Up -->
<div class="mt-6 flex items-center justify-center gap-4">
<div class="h-px bg-border-subtle flex-1"></div>
<span class="text-body-xs text-outline">or sign up with</span>
<div class="h-px bg-border-subtle flex-1"></div>
</div>
<div class="mt-6 flex justify-center gap-4">
<button class="w-12 h-12 rounded-lg border border-border-subtle flex items-center justify-center hover:bg-surface-alt transition-colors bg-surface-container-lowest" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
</button>
<button class="w-12 h-12 rounded-lg border border-border-subtle flex items-center justify-center hover:bg-surface-alt transition-colors bg-surface-container-lowest" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" fill="#1877F2"></path>
</svg>
</button>
<button class="w-12 h-12 rounded-lg border border-border-subtle flex items-center justify-center hover:bg-surface-alt transition-colors bg-surface-container-lowest" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M12 24c6.627 0 12-5.373 12-12S18.627 0 12 0 0 5.373 0 12s5.373 12 12 12z" fill="#000000" opacity="0"></path>
<path d="M16.54 12.63c-.02-2.12 1.74-3.15 1.81-3.2-1-1.44-2.52-1.64-3.08-1.67-1.3-.13-2.55.77-3.2.77-.66 0-1.68-.76-2.76-.74-1.4.02-2.7.81-3.41 2.06-1.45 2.51-.37 6.22 1.05 8.26.69 1 1.48 2.08 2.58 2.04 1.06-.04 1.47-.69 2.76-.69 1.28 0 1.66.69 2.78.67 1.13-.02 1.83-1.02 2.5-2.02.77-1.13 1.09-2.22 1.11-2.28-.02-.01-2.13-.82-2.14-3.2zM14.49 6.8c.58-.71.98-1.7.88-2.67-.84.03-1.89.56-2.49 1.27-.53.62-.99 1.63-.87 2.58.94.07 1.9-.47 2.48-1.18z" fill="#000000"></path>
</svg>
</button>
</div>
<div class="mt-auto pt-8">
<p class="text-center text-body-sm font-medium text-on-surface-variant">
    Already have an account? 
    <a class="text-[#1967d2] hover:underline ml-1" href="#">Log in</a>
</p>
</div>
</form>
</main>
</body></html>
