<body class="bg-surface-container-lowest text-on-background font-body-lg min-h-screen flex flex-col items-center px-margin-mobile pt-[80px] pb-stack-lg relative overflow-hidden">
<!-- Main Login Container (Minimalist) -->
<main class="w-full max-w-[400px] bg-surface-container-lowest relative z-10 flex flex-col">
<!-- Header -->
<header class="flex flex-col items-center text-center mb-8 mt-8">
<h1 class="text-display-lg-mobile font-display-lg-mobile text-on-surface">Đăng nhập</h1>
<p class="text-body-sm font-body-sm text-outline">Quản lý tài chính thông minh cùng CoinTap</p>
</header>
<!-- Login Form -->
<form class="flex flex-col gap-5 mt-4 w-full" onsubmit="event.preventDefault();">
<!-- Email Input Group -->
<div class="flex flex-col gap-1.5">
<label class="text-label-caps font-label-caps text-on-surface-variant ml-1" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px] pointer-events-none" data-icon="mail">mail</span>
<input class="w-full bg-surface-container-lowest border border-border-subtle rounded-lg pl-10 pr-4 py-3 text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline-variant" id="email" placeholder="Nhập email của bạn" required="" type="email">
</div>
</div>
<!-- Password Input Group -->
<div class="flex flex-col gap-1.5">
<label class="text-label-caps font-label-caps text-on-surface-variant ml-1" for="password">Mật khẩu</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px] pointer-events-none" data-icon="lock">lock</span>
<input class="w-full bg-surface-container-lowest border border-border-subtle rounded-lg pl-10 pr-10 py-3 text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline-variant" id="password" placeholder="Nhập mật khẩu" required="" type="password">
<button aria-label="Hiện mật khẩu" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end mt-1">
<a class="text-label-caps font-label-caps text-primary hover:text-on-primary-fixed-variant transition-colors" href="#">Quên mật khẩu?</a>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary rounded-lg py-3 mt-4 text-body-lg font-headline-md hover:bg-on-primary-fixed-variant focus:ring-4 focus:ring-primary-fixed transition-all active:scale-[0.98]" type="submit">
                Đăng nhập
            </button>
</form>
<!-- Divider -->
<div class="mt-6 flex items-center justify-center gap-4 w-full">
<div class="flex-1 h-[1px] bg-border-subtle"></div>
<span class="text-label-caps font-label-caps text-outline">Hoặc đăng nhập bằng</span>
<div class="flex-1 h-[1px] bg-border-subtle"></div>
</div>
<!-- Social Login -->
<div class="mt-6 flex justify-center gap-4 w-full">
<button class="w-12 h-12 flex justify-center items-center bg-surface-container-lowest border border-border-subtle rounded-full hover:bg-surface-container-low focus:ring-2 focus:ring-border-subtle transition-colors active:bg-surface-container-high" type="button">
<svg aria-hidden="true" fill="none" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
</button>
<button class="w-12 h-12 flex justify-center items-center bg-surface-container-lowest border border-border-subtle rounded-full hover:bg-surface-container-low focus:ring-2 focus:ring-border-subtle transition-colors active:bg-surface-container-high" type="button">
<svg aria-hidden="true" fill="currentColor" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-2c-.55 0-1 .45-1 1v2h3v3h-3v6.95c5.05-.5 9-4.76 9-9.95z" fill="#1877F2"></path>
</svg>
</button>
<button class="w-12 h-12 flex justify-center items-center bg-surface-container-lowest border border-border-subtle rounded-full hover:bg-surface-container-low focus:ring-2 focus:ring-border-subtle transition-colors active:bg-surface-container-high" type="button">
<svg aria-hidden="true" class="text-on-surface" fill="currentColor" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M16.142 2.825c1.077-1.332 1.802-3.153 1.606-4.99-1.57.065-3.486 1.067-4.603 2.37-1.002 1.162-1.875 3.036-1.637 4.836 1.76.138 3.553-.883 4.634-2.216z"></path>
<path d="M16.924 17.514c-1.334 3.916-4.227 6.486-7.224 6.486-3.145 0-4.053-1.89-7.668-1.89-3.568 0-4.665 1.84-7.515 1.84-2.946 0-6.195-2.887-7.85-6.84-3.344-8.008-.66-14.97 4.305-15.02 2.366-.025 4.542 1.626 5.922 1.626 1.43 0 3.863-1.815 6.447-1.547 2.76.284 5.253 1.674 6.643 3.957-5.597 3.42-4.646 11.233.94 13.388z" transform="translate(4 5)"></path>
</svg>
</button>
</div>
<!-- Footer / Register Link -->
<div class="mt-auto pt-8 text-center">
<span class="text-body-sm font-body-sm text-outline">Chưa có tài khoản?</span>
<a class="text-body-sm font-headline-md text-primary hover:text-on-primary-fixed-variant transition-colors ml-1" href="#">Đăng ký ngay</a>
</div>
</main>


</body></html>
