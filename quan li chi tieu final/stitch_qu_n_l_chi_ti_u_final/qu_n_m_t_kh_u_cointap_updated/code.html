<!DOCTYPE html><html lang="vi"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Quên mật khẩu</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

            theme: {

                        "outline": "#737686",
                        "surface-tint": "#0053db",
                        "surface-bright": "#faf8ff",
                        "error": "#EF4444",
                        "surface-variant": "#dae2fd",
                        "surface-alt": "#F8FAFC",

                        "on-surface": "#131b2e",
                        "secondary-fixed": "#eaddff",
                        "surface-container-low": "#f2f3ff",
                        "on-secondary-fixed": "#25005a",
                        "on-secondary-fixed-variant": "#5a00c6",
                        "outline-variant": "#c3c6d7",
                        "on-error-container": "#93000a",
                        "inverse-surface": "#283044",
                        "surface": "#faf8ff",
                        "tertiary": "#943700",
                        "primary-fixed": "#dbe1ff",
                        "secondary-fixed-dim": "#d2bbff",
                        "surface-dim": "#d2d9f4",
                        "tertiary-fixed-dim": "#ffb596",
                        "border-subtle": "#E2E8F0",
                        "secondary-container": "#8a4cfc",
                        "tertiary-container": "#bc4800",
                        "surface-container": "#eaedff",
                        "surface-container-high": "#e2e7ff",
                        "on-primary-fixed-variant": "#003ea8",
                        "on-surface-variant": "#434655",
                        "on-primary-container": "#eeefff",
                        "tertiary-fixed": "#ffdbcd",
                        "on-primary-fixed": "#00174b",
                        "on-background": "#131b2e",
                        "on-secondary": "#ffffff",
                        "warning": "#F59E0B",

                        "on-tertiary-fixed": "#360f00",
                        "background": "#faf8ff",
                        "inverse-on-surface": "#eef0ff",
                        "primary": "#004ac6",
                        "on-tertiary": "#ffffff",
                        "inverse-primary": "#b4c5ff",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "20px",
                        "stack-md": "12px",
                        "gutter": "16px",
                        "section-padding": "32px",

                        "stack-lg": "24px"
                    },
                    "fontFamily": {
                        "label-caps": ["Manrope"],
                        "body-lg": ["Manrope"],

                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],

<style>
        body { font-family: 'Manrope', sans-serif !important; }
        body { min-height: max(884px, 100dvh); }
    </style>
</head>
<body class="bg-surface-container-lowest text-on-surface min-h-screen flex flex-col antialiased">
<!-- Header / Back Navigation -->
<header class="w-full px-margin-mobile py-4 flex items-center justify-between">
<button aria-label="Quay lại" class="w-10 h-10 flex items-center justify-start text-on-surface hover:text-on-surface-variant transition-colors duration-200">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="w-10"></div>
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col items-start justify-start px-margin-mobile pt-[80px] pb-section-padding w-full max-w-md mx-auto">
<!-- Typography Block -->
<div class="w-full mb-8 text-center mt-8 flex flex-col gap-2">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface font-bold text-center">Quên mật khẩu</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant text-center px-2">
                Đừng lo lắng! Nhập email của bạn để nhận hướng dẫn đặt lại mật khẩu.
            </p>
</div>
<!-- Form Block -->
<form class="w-full flex flex-col gap-5 mt-4" onsubmit="event.preventDefault();">
<!-- Email Input Field -->
<div class="flex flex-col gap-1.5">
<label class="font-body-sm text-body-sm text-on-surface-variant" for="email">Địa chỉ Email</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline z-10 text-xl" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="w-full bg-surface-container-lowest border border-border-subtle rounded-xl pl-12 pr-4 py-3.5 font-body-sm text-body-sm text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="email" name="email" placeholder="Nhập email của bạn" required="" type="email">
</div>
</div>
<!-- Primary Action Button -->
<div class="mt-4 flex flex-col gap-4"><button class="w-full bg-primary-fixed-dim text-on-primary-fixed font-body-lg text-body-lg font-medium py-3.5 rounded-xl flex items-center justify-center hover:bg-primary-fixed transition-all duration-200" type="submit">Gửi yêu cầu</button></div>
</form>
<!-- Secondary Action / Return to Login -->
<div class="mt-auto pt-stack-lg w-full text-center">
<button class="font-body-sm text-body-sm text-primary hover:text-surface-tint hover:underline transition-colors duration-200 font-medium">
                Quay lại Đăng nhập
            </button>
</div>
</main>


</body></html>
