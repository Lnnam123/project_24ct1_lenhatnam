<!DOCTYPE html><html lang="vi"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Trung tâm trợ giúp</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#ffb596",
                        "on-tertiary-container": "#ffede6",
                        "secondary-container": "#8a4cfc",
                        "secondary": "#712ae2",
                        "outline": "#737686",
                        "primary": "#004ac6",
                        "border-subtle": "#E2E8F0",
                        "inverse-on-surface": "#eef0ff",
                        "on-tertiary-fixed": "#360f00",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface-bright": "#faf8ff",
                        "error": "#EF4444",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "primary-container": "#2563eb",
                        "error-container": "#ffdad6",
                        "outline-variant": "#c3c6d7",
                        "on-background": "#131b2e",
                        "background": "#faf8ff",
                        "inverse-surface": "#283044",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-error": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-alt": "#F8FAFC",
                        "on-secondary": "#ffffff",
                        "on-secondary-container": "#fffbff",
                        "primary-fixed": "#dbe1ff",
                        "surface-container-high": "#e2e7ff",
                        "on-surface-variant": "#434655",
                        "on-primary": "#ffffff",
                        "warning": "#F59E0B",
                        "on-surface": "#131b2e",
                        "surface-container": "#eaedff",
                        "tertiary": "#943700",
                        "surface-container-low": "#f2f3ff",
                        "tertiary-fixed": "#ffdbcd",
                        "surface-variant": "#dae2fd",
                        "surface-tint": "#0053db",
                        "surface-container-highest": "#dae2fd",
                        "inverse-primary": "#b4c5ff",
                        "on-primary-fixed": "#00174b",
                        "on-primary-container": "#eeefff",
                        "on-secondary-fixed": "#25005a",
                        "on-error-container": "#93000a",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#d2bbff",
                        "on-secondary-fixed-variant": "#5a00c6",
                        "secondary-fixed": "#eaddff",
                        "surface-dim": "#d2d9f4",
                        "surface": "#faf8ff",
                        "tertiary-container": "#bc4800",
                        "success": "#10B981"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "section-padding": "32px",
                        "base": "8px",
                        "stack-md": "12px",
                        "margin-mobile": "20px",
                        "stack-lg": "24px",
                        "stack-sm": "4px"
                    },
                    "fontFamily": {
                        "display-lg": ["Manrope", "sans-serif"],
                        "body-lg": ["Manrope", "sans-serif"],
                        "headline-md": ["Manrope", "sans-serif"],
                        "display-lg-mobile": ["Manrope", "sans-serif"],
                        "numeric-data": ["Manrope", "sans-serif"],
                        "body-sm": ["Manrope", "sans-serif"],
                        "label-caps": ["Manrope", "sans-serif"]
                    },
                    "fontSize": {
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "numeric-data": ["18px", { "lineHeight": "24px", "fontWeight": "500" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface font-body-sm min-h-screen pb-[80px]">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface font-headline-md text-headline-md docked full-width top-0 flat no shadows flex items-center w-full h-16 sticky z-10 transition-colors duration-200" style="padding-left: 24px; padding-right: 24px;">
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-low dark:hover:bg-surface-container-low p-2 rounded-full mr-4 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface dark:text-on-surface font-extrabold flex-1">Help Center</h1>
</header>
<main class="flex flex-col gap-stack-lg max-w-2xl mx-auto py-stack-lg" style="padding-left: 24px; padding-right: 24px;">
<!-- Search Bar -->
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
<input class="w-full bg-surface-alt border border-border-subtle rounded-xl py-3 pl-12 pr-4 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors text-body-lg font-body-lg" placeholder="Tìm kiếm câu hỏi..." type="text">
</div>
<!-- Categories Bento Grid -->
<section>
<h2 class="font-headline-md text-headline-md mb-stack-md">Danh mục</h2>
<div class="grid grid-cols-2 gap-stack-md">
<button class="bg-surface-container-lowest shadow-[0_4px_12px_rgba(0,0,0,0.05)] rounded-xl p-4 flex flex-col items-center justify-center gap-2 hover:bg-surface-container-low transition-colors">
<div class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="person">person</span>
</div>
<span class="font-numeric-data text-numeric-data">Tài khoản</span>
</button>
<button class="bg-surface-container-lowest shadow-[0_4px_12px_rgba(0,0,0,0.05)] rounded-xl p-4 flex flex-col items-center justify-center gap-2 hover:bg-surface-container-low transition-colors">
<div class="w-12 h-12 rounded-full bg-tertiary-fixed flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined" data-icon="swap_horiz">swap_horiz</span>
</div>
<span class="font-numeric-data text-numeric-data">Giao dịch</span>
</button>
<button class="bg-surface-container-lowest shadow-[0_4px_12px_rgba(0,0,0,0.05)] rounded-xl p-4 flex flex-col items-center justify-center gap-2 hover:bg-surface-container-low transition-colors">
<div class="w-12 h-12 rounded-full bg-secondary-fixed flex items-center justify-center text-secondary">
<span class="material-symbols-outlined" data-icon="security">security</span>
</div>
<span class="font-numeric-data text-numeric-data">Bảo mật</span>
</button>
<button class="bg-surface-container-lowest shadow-[0_4px_12px_rgba(0,0,0,0.05)] rounded-xl p-4 flex flex-col items-center justify-center gap-2 hover:bg-surface-container-low transition-colors">
<div class="w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="more_horiz">more_horiz</span>
</div>
<span class="font-numeric-data text-numeric-data">Khác</span>
</button>
</div>
</section>
<!-- FAQs -->
<section>
<h2 class="font-headline-md text-headline-md mb-stack-md">Câu hỏi thường gặp</h2>
<div class="flex flex-col gap-stack-sm bg-surface-container-lowest shadow-[0_4px_12px_rgba(0,0,0,0.05)] rounded-xl overflow-hidden">
<button class="flex items-center justify-between p-4 border-b border-border-subtle hover:bg-surface-container-low transition-colors text-left w-full">
<span class="font-body-lg text-body-lg">Làm sao để đổi mật khẩu?</span>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</button>
<button class="flex items-center justify-between p-4 border-b border-border-subtle hover:bg-surface-container-low transition-colors text-left w-full">
<span class="font-body-lg text-body-lg">Làm thế nào để thêm giao dịch?</span>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</button>
<button class="flex items-center justify-between p-4 border-b border-border-subtle hover:bg-surface-container-low transition-colors text-left w-full">
<span class="font-body-lg text-body-lg">Làm sao để liên kết ngân hàng?</span>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</button>
<button class="flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors text-left w-full">
<span class="font-body-lg text-body-lg">Cách khôi phục tài khoản bị khóa?</span>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</section>
<!-- Contact Support -->
<section class="mt-stack-lg">
<button class="w-full bg-primary text-on-primary py-4 rounded-xl font-headline-md text-headline-md hover:bg-primary-container transition-colors shadow-sm flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="headset_mic">headset_mic</span>
                Liên hệ Hỗ trợ
            </button>
</section>
</main>
<!-- BottomNavBar (Suppressed due to sub-page intent) -->
<!-- Navigation shell is hidden to prioritize the Help Center content canvas as it's a sub-page/task-focused area. -->


</body></html>
