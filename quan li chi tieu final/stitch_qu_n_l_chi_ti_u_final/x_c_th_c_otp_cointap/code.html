<style>

<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col items-center justify-center">
<!-- Main Container -->
<main class="w-full max-w-md px-margin-mobile flex flex-col items-center">
<!-- Back Button (Transactional/Linear flow, no global nav) -->
<div class="w-full flex justify-start mb-stack-lg">
<button class="p-base rounded-full hover:bg-surface-container-low transition-colors duration-200 flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
</div>
<!-- Illustration -->
<div class="w-24 h-24 mb-stack-lg rounded-full bg-surface-container-high flex items-center justify-center shadow-[0_4px_12px_rgba(0,74,198,0.15)]">
<span class="material-symbols-outlined text-primary text-[48px]" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<!-- Header -->
<div class="text-center mb-section-padding">
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-on-surface mb-stack-sm">Xác thực mã OTP</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                Vui lòng nhập mã 6 số được gửi đến email<br/>
<span class="font-semibold text-on-surface">user@cointap.vn</span>
</p>
</div>
<!-- OTP Input Form -->
<form class="w-full flex flex-col items-center gap-stack-lg">
<!-- OTP Grid -->
<div class="flex gap-gutter w-full justify-center" id="otp-container">
<!-- Generate 6 input boxes -->
<input autofocus="" class="w-12 h-14 md:w-14 md:h-16 text-center font-numeric-data text-display-lg-mobile bg-surface-alt border border-border-subtle rounded-lg focus:border-primary focus:ring-2 focus:ring-primary-fixed-dim outline-none transition-all text-on-surface shadow-sm" maxlength="1" pattern="\d*" type="number"/>
<input class="w-12 h-14 md:w-14 md:h-16 text-center font-numeric-data text-display-lg-mobile bg-surface-alt border border-border-subtle rounded-lg focus:border-primary focus:ring-2 focus:ring-primary-fixed-dim outline-none transition-all text-on-surface shadow-sm" maxlength="1" pattern="\d*" type="number"/>
<input class="w-12 h-14 md:w-14 md:h-16 text-center font-numeric-data text-display-lg-mobile bg-surface-alt border border-border-subtle rounded-lg focus:border-primary focus:ring-2 focus:ring-primary-fixed-dim outline-none transition-all text-on-surface shadow-sm" maxlength="1" pattern="\d*" type="number"/>
<input class="w-12 h-14 md:w-14 md:h-16 text-center font-numeric-data text-display-lg-mobile bg-surface-alt border border-border-subtle rounded-lg focus:border-primary focus:ring-2 focus:ring-primary-fixed-dim outline-none transition-all text-on-surface shadow-sm" maxlength="1" pattern="\d*" type="number"/>
<input class="w-12 h-14 md:w-14 md:h-16 text-center font-numeric-data text-display-lg-mobile bg-surface-alt border border-border-subtle rounded-lg focus:border-primary focus:ring-2 focus:ring-primary-fixed-dim outline-none transition-all text-on-surface shadow-sm" maxlength="1" pattern="\d*" type="number"/>
<input class="w-12 h-14 md:w-14 md:h-16 text-center font-numeric-data text-display-lg-mobile bg-surface-alt border border-border-subtle rounded-lg focus:border-primary focus:ring-2 focus:ring-primary-fixed-dim outline-none transition-all text-on-surface shadow-sm" maxlength="1" pattern="\d*" type="number"/>
</div>
<!-- Resend Timer -->
<div class="text-center font-body-sm text-body-sm">
<span class="text-on-surface-variant">Bạn chưa nhận được mã? </span>
<span class="text-primary font-medium" id="timer">Gửi lại (00:59)</span>
<!-- Hidden state when timer expires: <button type="button" class="text-primary font-semibold hover:underline">Gửi lại ngay</button> -->
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary py-4 rounded-xl font-headline-md text-headline-md shadow-[0_4px_12px_rgba(0,74,198,0.2)] hover:bg-surface-tint transition-colors mt-stack-md flex items-center justify-center gap-2" type="submit">
                Xác nhận
            </button>
</form>
</main>
<script>
        // Simple logic for OTP inputs auto-focusing
        const inputs = document.querySelectorAll('#otp-container input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1);
                }
                if (e.target.value.length === 1) {
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value) {
                    if (index > 0) {
                        inputs[index - 1].focus();
                    }
                }
            });
        });
    </script>
