<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CoinTap - Add Transaction</title>

            darkMode: "class",

                    colors: {

                        "on-primary-container": "#eeefff",

                        "outline": "#737686",
                        "on-primary-fixed-variant": "#003ea8",
                        "outline-variant": "#c3c6d7",

                        "on-tertiary-fixed-variant": "#7d2d00",
                        "surface-container-high": "#e2e7ff",

                        "primary": "#004ac6"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "stack-sm": "4px",
                        "section-padding": "32px",
                        "stack-lg": "24px",
                        "stack-md": "12px",
                        "gutter": "16px",
                        "margin-mobile": "20px",
                        "base": "8px"
                    },
                    fontFamily: {
                        "headline-md": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-caps": ["Inter"],

                        "numeric-data": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    fontSize: {

                        "display-lg-mobile": ["28px", { lineHeight: "36px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "label-caps": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600" }],
                        "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "numeric-data": ["18px", { lineHeight: "24px", fontWeight: "500" }],
                        "display-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }]
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'ping-slow': 'ping 2s cubic-bezier(0, 0, 0.2, 1) infinite',
                    }
                }
            }
        }

<style>
        /* Hide scrollbar for category chips but allow scrolling */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-lg antialiased selection:bg-primary-fixed selection:text-primary">
<div class="max-w-md mx-auto min-h-screen relative flex flex-col bg-surface shadow-[0_0_40px_rgba(0,0,0,0.05)]">
<header class="flex items-center justify-between px-margin-mobile h-16 w-full bg-surface z-40 sticky top-0">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-container-low transition-colors text-primary active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">New Transaction</h1>
<div class="w-10"></div>
</header>
<div class="px-margin-mobile py-stack-md z-30 bg-surface">
<div class="flex p-1 bg-surface-container-low rounded-xl">
<button class="flex-1 py-2.5 font-label-caps text-label-caps rounded-lg bg-surface shadow-sm text-primary transition-all duration-200" id="tab-btn-manual" onclick="switchTab('manual')">
                    Manual
                </button>
<button class="flex-1 py-2.5 font-label-caps text-label-caps rounded-lg text-on-surface-variant hover:text-primary transition-all duration-200" id="tab-btn-ai" onclick="switchTab('ai')">
                    AI Assistant
                </button>
</div>
</div>
<main class="flex-1 flex flex-col pb-32 transition-opacity duration-300" id="view-manual">
<div class="flex flex-col items-center py-section-padding px-margin-mobile">
<span class="font-label-caps text-label-caps text-outline uppercase tracking-wider mb-2">Amount Spent</span>
<div class="flex items-center justify-center relative w-full">
<span class="font-display-lg-mobile text-display-lg-mobile text-outline-variant absolute left-1/4 -ml-4 pointer-events-none">$</span>
<input autofocus="" class="w-full text-center bg-transparent border-none font-display-lg text-display-lg text-on-surface focus:ring-0 placeholder:text-surface-container-highest appearance-none" placeholder="0.00" style="-moz-appearance: textfield;" type="number"/>
</div>
</div>
<div class="px-margin-mobile flex flex-col gap-stack-md mt-stack-lg">
<span class="font-label-caps text-label-caps text-outline uppercase tracking-wider">Category</span>
<div class="flex overflow-x-auto no-scrollbar gap-2 pb-2 -mx-margin-mobile px-margin-mobile">
<button class="shrink-0 px-5 py-2.5 rounded-full bg-primary-fixed text-primary font-label-caps text-label-caps flex items-center gap-2 border border-transparent">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">restaurant</span>
                        Dining
                    </button>
<button class="shrink-0 px-5 py-2.5 rounded-full bg-surface-container-low text-on-surface-variant hover:bg-surface-container font-label-caps text-label-caps flex items-center gap-2 border border-border-subtle transition-colors">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 0;">shopping_cart</span>
                        Groceries
                    </button>
<button class="shrink-0 px-5 py-2.5 rounded-full bg-surface-container-low text-on-surface-variant hover:bg-surface-container font-label-caps text-label-caps flex items-center gap-2 border border-border-subtle transition-colors">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 0;">commute</span>
                        Transit
                    </button>
<button class="shrink-0 px-5 py-2.5 rounded-full bg-surface-container-low text-on-surface-variant hover:bg-surface-container font-label-caps text-label-caps flex items-center gap-2 border border-border-subtle transition-colors">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 0;">bolt</span>
                        Utilities
                    </button>
</div>
</div>
<div class="px-margin-mobile mt-section-padding flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-outline uppercase tracking-wider" for="notes">Note (Optional)</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-3 text-outline-variant" style="font-variation-settings: 'FILL' 0;">edit_note</span>
<textarea class="w-full bg-surface-alt border border-border-subtle rounded-xl pl-10 pr-4 py-3 font-body-sm text-body-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none resize-none h-24 placeholder:text-outline-variant transition-shadow" id="notes" placeholder="What was this expense for?"></textarea>
</div>
</div>
<div class="fixed bottom-0 max-w-md w-full p-margin-mobile bg-gradient-to-t from-surface via-surface to-transparent z-40">
<button class="w-full py-4 bg-primary text-on-primary rounded-xl font-headline-md text-headline-md shadow-lg shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all duration-200 flex justify-center items-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                    Save Transaction
                </button>
</div>
</main>
<main class="flex-1 hidden flex-col items-center justify-center pb-32 px-margin-mobile bg-surface transition-opacity duration-300 opacity-0 relative overflow-hidden" id="view-ai">
<div class="absolute inset-0 bg-gradient-to-b from-secondary-fixed/30 to-transparent pointer-events-none rounded-t-[40px] -mx-4 -mt-10"></div>
<div class="flex flex-col items-center justify-center flex-1 w-full gap-stack-lg z-10 -mt-20">
<div class="relative flex items-center justify-center w-40 h-40">
<div class="absolute inset-0 bg-secondary-container rounded-full opacity-20 animate-ping-slow"></div>
<div class="absolute inset-4 bg-secondary-fixed rounded-full opacity-40 animate-pulse-slow"></div>
<button class="relative z-10 w-20 h-20 bg-secondary text-on-secondary rounded-full flex items-center justify-center shadow-lg shadow-secondary/30 active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
<div class="text-center space-y-stack-sm">
<h2 class="font-headline-md text-headline-md text-on-surface">Listening...</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-[250px]">
                        "I spent 12 dollars on lunch at the cafe"
                    </p>
</div>
</div>
<div class="w-full mt-auto mb-10 z-10">
<div class="flex items-center gap-4 mb-4">
<div class="h-px bg-border-subtle flex-1"></div>
<span class="font-label-caps text-label-caps text-outline uppercase">or</span>
<div class="h-px bg-border-subtle flex-1"></div>
</div>
<button class="w-full py-4 bg-surface-alt border border-border-subtle text-on-surface rounded-xl font-headline-md text-headline-md active:bg-surface-container-low transition-colors flex justify-center items-center gap-2">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 0;">document_scanner</span>
                    Scan Receipt
                </button>
</div>
</main>
</div>
<script>
        function switchTab(tabId) {
            const manualView = document.getElementById('view-manual');
            const aiView = document.getElementById('view-ai');
            const btnManual = document.getElementById('tab-btn-manual');
            const btnAi = document.getElementById('tab-btn-ai');

            if (tabId === 'manual') {
                // Style buttons
                btnManual.classList.add('bg-surface', 'shadow-sm', 'text-primary');
                btnManual.classList.remove('text-on-surface-variant');
                btnAi.classList.remove('bg-surface', 'shadow-sm', 'text-primary');
                btnAi.classList.add('text-on-surface-variant');

                // Toggle views with fade
                aiView.classList.replace('opacity-100', 'opacity-0');
                setTimeout(() => {
                    aiView.classList.add('hidden');
                    aiView.classList.remove('flex');
                    manualView.classList.remove('hidden');
                    manualView.classList.add('flex');
                    // slight delay to allow display block to apply before opacity transition
                    setTimeout(() => manualView.classList.replace('opacity-0', 'opacity-100'), 10);
                }, 300);

            } else {
                // Style buttons
                btnAi.classList.add('bg-surface', 'shadow-sm', 'text-primary');
                btnAi.classList.remove('text-on-surface-variant');
                btnManual.classList.remove('bg-surface', 'shadow-sm', 'text-primary');
                btnManual.classList.add('text-on-surface-variant');

                // Toggle views with fade
                manualView.classList.replace('opacity-100', 'opacity-0');
                setTimeout(() => {
                    manualView.classList.add('hidden');
                    manualView.classList.remove('flex');
                    aiView.classList.remove('hidden');
                    aiView.classList.add('flex');
                    setTimeout(() => aiView.classList.replace('opacity-0', 'opacity-100'), 10);
                }, 300);
            }
        }
    </script>
</body></html>
