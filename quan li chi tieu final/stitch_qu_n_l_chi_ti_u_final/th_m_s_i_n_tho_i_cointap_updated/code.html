<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col md:items-center md:justify-center md:bg-surface-container-low">
<!-- Mobile Wrapper / Desktop Card -->
<main class="flex-1 w-full max-w-md mx-auto bg-surface md:rounded-2xl md:shadow-lg md:min-h-[800px] flex flex-col relative overflow-hidden">
<!-- Header -->
<header class="flex items-center px-margin-mobile h-16 w-full shrink-0">
<button aria-label="Quay lại" class="p-2 -ml-2 text-on-surface hover:bg-surface-container-low rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-2xl" data-icon="arrow_back">arrow_back</span>
</button>
</header>
<!-- Main Content -->
<div class="flex-1 flex flex-col px-margin-mobile pb-section-padding pt-[80px]">
<!-- Title & Instructions -->
<h1 class="text-headline-md font-headline-md text-on-surface mb-2">Số điện thoại</h1>
<p class="text-body-sm font-body-sm text-on-surface-variant mb-8">
            Vui lòng thêm số điện thoại của bạn để tăng cường bảo mật.
        </p>
<!-- Input Section -->
<div class="mb-stack-lg">
<label class="text-body-sm font-body-sm text-on-surface mb-stack-sm block" for="phone-input">
                Số điện thoại
            </label>
<div class="flex flex-row w-full gap-2">
<!-- Country Code Selector -->
<button class="flex items-center justify-center gap-1 px-4 py-3 bg-surface-container-lowest border border-border-subtle rounded-lg text-on-surface hover:bg-surface-container-low transition-colors" type="button">
<span class="text-body-lg font-body-lg">🇻🇳 +84</span>
<span class="material-symbols-outlined text-[20px] text-outline" data-icon="expand_more">expand_more</span>
</button>
<!-- Phone Input -->
<input autocomplete="tel-national" class="flex-1 w-full bg-surface-container-lowest border border-border-subtle rounded-lg px-4 py-3 text-body-lg font-body-lg text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="phone-input" placeholder="Nhập số điện thoại" type="tel">
</div>
</div>
<!-- Footer Action -->
<div class="shrink-0 w-full mt-4">
<button class="w-full bg-primary-fixed-dim text-on-primary-fixed-variant py-3 rounded-lg text-body-lg font-body-lg font-semibold hover:bg-primary hover:text-on-primary transition-all duration-200 flex items-center justify-center">
                Gửi mã xác thực
            </button>
</div>
</div>
</main>
<script>
    // Simple micro-interaction for input formatting
    const phoneInput = document.getElementById('phone-input');
    phoneInput.addEventListener('input', function(e) {
        let x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,3})(\d{0,4})/);
        e.target.value = !x[2] ? x[1] : x[1] + ' ' + x[2] + (x[3] ? ' ' + x[3] : '');
    });
</script>
