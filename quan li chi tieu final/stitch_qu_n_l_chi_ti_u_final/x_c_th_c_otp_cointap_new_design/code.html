<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Xác thực số điện thoại - OTP Verification</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
          },
          colors: {
            primary: '#2563eb', // Blue-600
            'primary-hover': '#1d4ed8', // Blue-700
            'primary-disabled': '#93c5fd', // Blue-300
          }
        }
      }
    }
  </script>
<style data-purpose="otp-inputs">
    /* Custom styles for OTP input boxes to hide arrows in number inputs */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="bg-white text-gray-900 font-sans antialiased h-screen flex flex-col">
<!-- BEGIN: MainHeader -->
<header class="flex-none px-4 pt-12 pb-4 flex items-center justify-between" data-purpose="top-navigation">
<!-- Back Button -->
<button aria-label="Go back" class="p-2 -ml-2 text-gray-600 hover:text-gray-900 focus:outline-none">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15.75 19.5L8.25 12l7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Placeholder for right-side icons if needed in the future, keeps flex layout balanced -->
<div class="w-10"></div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: MainContent -->
<main class="flex-grow px-6 pt-4 flex flex-col" data-purpose="otp-verification-content">
<!-- Header Text Section -->
<section class="mb-10" data-purpose="titles">
<h1 class="text-2xl font-bold mb-2 text-gray-900">Xác thực số điện thoại</h1>
<p class="text-sm text-gray-500 leading-relaxed">Chúng tôi đã gửi mã 6 chữ số đến +84 98 765 4321</p>
</section>
<!-- OTP Input Form -->
<form class="flex flex-col gap-6" data-purpose="otp-form" onsubmit="event.preventDefault();">
<!-- Input Boxes Container -->
<div class="flex justify-between gap-2 w-full max-w-sm mx-auto" data-purpose="otp-input-group">
<!-- Input 1 -->
<input aria-label="Digit 1" class="w-12 h-14 text-center text-xl font-semibold border border-gray-300 rounded-xl focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" maxlength="1" pattern="\d*" type="number" value="6"/>
<!-- Input 2 -->
<input aria-label="Digit 2" class="w-12 h-14 text-center text-xl font-semibold border border-gray-300 rounded-xl focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" maxlength="1" pattern="\d*" type="number" value="4"/>
<!-- Input 3 -->
<input aria-label="Digit 3" class="w-12 h-14 text-center text-xl font-semibold border border-gray-300 rounded-xl focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" maxlength="1" pattern="\d*" type="number" value="0"/>
<!-- Input 4 -->
<input aria-label="Digit 4" class="w-12 h-14 text-center text-xl font-semibold border border-gray-300 rounded-xl focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" maxlength="1" pattern="\d*" type="number" value="3"/>
<!-- Input 5 -->
<input aria-label="Digit 5" class="w-12 h-14 text-center text-xl font-semibold border border-gray-300 rounded-xl focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" maxlength="1" pattern="\d*" type="number" value="2"/>
<!-- Input 6 -->
<input aria-label="Digit 6" class="w-12 h-14 text-center text-xl font-semibold border border-gray-300 rounded-xl focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" maxlength="1" pattern="\d*" type="number" value="5"/>
</div>
<p class="text-xs text-center text-gray-400 mt-[-8px]">Nhập mã bạn nhận được qua SMS</p>
<!-- Verify Button -->
<button class="w-full bg-primary text-white font-semibold py-4 rounded-xl mt-4 hover:bg-primary-hover focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors shadow-sm" data-purpose="verify-button" type="submit">
        Xác nhận
      </button>
</form>
<!-- Resend Link -->
<div class="mt-8 text-center" data-purpose="resend-action">
<p class="text-sm text-gray-500">
        Bạn chưa nhận được mã? 
        <button class="text-primary font-semibold hover:underline focus:outline-none" data-purpose="resend-button" type="button">Gửi lại</button>
</p>
</div>
</main>
<!-- END: MainContent -->
<script data-purpose="otp-interaction">
    // Basic interaction for OTP inputs (auto-focus next)
    document.addEventListener('DOMContentLoaded', () => {
      const inputs = document.querySelectorAll('[data-purpose="otp-input-group"] input');
      
      inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
          // Allow only numbers
          input.value = input.value.replace(/[^0-9]/g, '');
          
          if (input.value.length === 1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }
        });

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !input.value && index > 0) {
            inputs[index - 1].focus();
          }
        });
      });
    });
  </script>
</body></html>
