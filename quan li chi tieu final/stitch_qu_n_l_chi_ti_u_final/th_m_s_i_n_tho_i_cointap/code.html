<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col md:items-center md:justify-center md:bg-surface-container-low">
<!-- Mobile Wrapper / Desktop Card -->

<!-- Header (Transactional - Simple Back) -->
<header class="flex items-center px-margin-mobile h-16 w-full shrink-0">
<button aria-label="Quay lại" class="p-2 -ml-2 text-on-surface hover:bg-surface-container-low rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-2xl" data-icon="arrow_back">arrow_back</span>
</button>
</header>
<!-- Main Content -->
<div class="flex-1 flex flex-col px-margin-mobile pt-stack-lg pb-section-padding">
<!-- Icon/Visual Header -->
<div class="w-16 h-16 rounded-full bg-primary-fixed flex items-center justify-center mb-stack-lg shadow-[0_4px_12px_rgba(37,99,235,0.15)]">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="phone_iphone" data-weight="fill" style="font-variation-settings: 'FILL' 1;">phone_iphone</span>
</div>
<!-- Title & Instructions -->
<h1 class="text-display-lg-mobile font-display-lg-mobile text-on-surface mb-stack-md">Số điện thoại</h1>
<p class="text-body-lg font-body-lg text-on-surface-variant mb-section-padding">
                Vui lòng thêm số điện thoại của bạn để tăng cường bảo mật cho tài khoản và dễ dàng khôi phục khi cần thiết.
            </p>
<!-- Input Section -->
<div class="mb-auto">
<label class="text-label-caps font-label-caps text-on-surface mb-stack-sm block uppercase" for="phone-input">
                    Số điện thoại
                </label>
<div class="flex flex-row w-full bg-surface-alt border border-border-subtle rounded-xl focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all duration-200 overflow-hidden shadow-sm">
<!-- Country Code Selector (Simulated) -->
<button class="flex items-center gap-1 px-4 py-4 bg-surface-container-low text-on-surface border-r border-border-subtle hover:bg-surface-container-high transition-colors" type="button">
<span class="text-body-lg font-body-lg font-medium">+84</span>
<span class="material-symbols-outlined text-[20px] text-outline" data-icon="expand_more">expand_more</span>
</button>
<!-- Phone Input -->
<input autocomplete="tel-national" class="flex-1 w-full bg-transparent border-none px-4 py-4 text-numeric-data font-numeric-data text-on-surface placeholder:text-outline focus:outline-none focus:ring-0" id="phone-input" placeholder="Nhập số điện thoại" type="tel"/>
</div>
</div>
<!-- Footer Action -->
<div class="mt-section-padding shrink-0 w-full">
<button class="w-full bg-primary text-on-primary py-4 rounded-xl text-body-lg font-body-lg font-semibold hover:bg-on-primary-fixed-variant transition-all duration-200 shadow-[0_4px_12px_rgba(37,99,235,0.25)] active:scale-[0.98] flex items-center justify-center gap-2">
                    Gửi mã OTP
                    <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
<p class="text-center text-body-sm font-body-sm text-outline mt-stack-md">
                    Bằng cách tiếp tục, bạn đồng ý nhận mã xác minh qua SMS.
                </p>
</div>
</div>
</main>
<script>
        // Simple micro-interaction for input formatting
        const phoneInput = document.getElementById('phone-input');
        phoneInput.addEventListener('input', function(e) {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,3})(\d{0,4})/);
            e.target.value = !x[2] ? x[1] : x[1] + ' ' + x[2] + (x[3] ? ' ' + x[3] : '');
        });
    </script>
