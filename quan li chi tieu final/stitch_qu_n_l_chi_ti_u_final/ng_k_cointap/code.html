    body {

<body class="bg-surface-container-lowest min-h-screen flex flex-col antialiased">
<!-- Main Content Canvas (No Nav Shell due to Linear/Transactional intent) -->
<main class="flex-1 flex flex-col px-margin-mobile pt-section-padding pb-stack-lg max-w-md mx-auto w-full justify-center">
<!-- Header / Illustration Area -->
<div class="w-full h-48 rounded-xl bg-surface-container-low mb-stack-lg flex flex-col items-center justify-center overflow-hidden relative shadow-[0_4px_24px_0_rgba(0,0,0,0.05)]" data-alt="A clean, minimalist 3D rendering of abstract geometric shapes, sleek spheres, and subtle metallic coins floating gently in mid-air. The scene uses a pristine white and soft light gray backdrop to create a modern, airy feel. Delicate accents of glowing primary blue (#004ac6) highlight the edges of the shapes, signifying trust, intelligence, and advanced financial technology. The lighting is soft, diffused, and studio-quality, emphasizing a professional and polished UI aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBv_2X0krAsne_Czi6yXmqUXBonDE6YCh0KdWEEPcguFEN3NiUgtrIs6HQNFVTJLI69eWZvefk5b4O0BQqbjbPMNPPvVeHT_NzK_HLuHAWd9tYOxEXnH6By4ae5ucmLcYVNKxRHw4auuujSJY_HC34kLmiAJlbxDQlGjF57HqHXqNkpfkPKDhfbvRdze4rP74cKHx3QeaUof3wKBTeU5WpMt76phPDWXk0DhKuFiSgei1CydBGgHcX7AQ'); background-size: cover; background-position: center;">
<!-- Overlay to ensure text readability if needed, though mostly illustrative -->
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest/50 to-transparent"></div>
</div>
<!-- Typography Header -->
<div class="mb-stack-lg text-center">
<h1 class="text-display-lg-mobile font-display-lg-mobile text-on-surface mb-stack-sm tracking-tight">Đăng ký tài khoản</h1>
<p class="text-body-lg font-body-lg text-on-surface-variant">Bắt đầu hành trình quản lý tài chính thông minh của bạn.</p>
</div>
<!-- Registration Form -->
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<!-- Full Name Input -->
<div class="flex flex-col gap-stack-sm">
<label class="text-label-caps font-label-caps text-on-surface uppercase" for="fullname">Họ và tên</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-gutter top-1/2 -translate-y-1/2 text-outline-variant" data-icon="person">person</span>
<input class="w-full bg-surface-alt border border-border-subtle rounded-lg pl-[48px] pr-gutter py-stack-md text-body-lg font-body-lg text-on-surface placeholder:text-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="fullname" name="fullname" placeholder="Nguyễn Văn A" type="text"/>
</div>
</div>
<!-- Email Input -->
<div class="flex flex-col gap-stack-sm">
<label class="text-label-caps font-label-caps text-on-surface uppercase" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-gutter top-1/2 -translate-y-1/2 text-outline-variant" data-icon="mail">mail</span>
<input class="w-full bg-surface-alt border border-border-subtle rounded-lg pl-[48px] pr-gutter py-stack-md text-body-lg font-body-lg text-on-surface placeholder:text-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="email" name="email" placeholder="email@example.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-stack-sm">
<label class="text-label-caps font-label-caps text-on-surface uppercase" for="password">Mật khẩu</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-gutter top-1/2 -translate-y-1/2 text-outline-variant" data-icon="lock">lock</span>
<input class="w-full bg-surface-alt border border-border-subtle rounded-lg pl-[48px] pr-gutter py-stack-md text-body-lg font-body-lg text-on-surface placeholder:text-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="password" name="password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-gutter top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="mt-stack-md flex flex-col gap-stack-lg">
<button class="w-full bg-primary text-on-primary py-stack-md rounded-full text-headline-md font-headline-md shadow-sm hover:opacity-90 active:scale-[0.98] transition-all duration-200" type="submit">
                    Đăng ký
                </button>
<p class="text-center text-body-sm font-body-sm text-on-surface-variant">
                    Đã có tài khoản? 
                    <a class="text-primary font-semibold hover:underline" href="#">Đăng nhập</a>
</p>
</div>
</form>
