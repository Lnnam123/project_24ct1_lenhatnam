<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Thêm danh mục - CoinTap</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary-fixed": "#dbe1ff",
                      "tertiary": "#943700",
                      "on-surface": "#131b2e",
                      "secondary-container": "#8a4cfc",
                      "secondary-fixed-dim": "#d2bbff",
                      "on-primary": "#ffffff",
                      "on-background": "#131b2e",
                      "inverse-primary": "#b4c5ff",
                      "surface-container-low": "#f2f3ff",
                      "on-error": "#ffffff",
                      "tertiary-fixed-dim": "#ffb596",
                      "surface-container-lowest": "#ffffff",
                      "on-primary-container": "#eeefff",
                      "on-tertiary": "#ffffff",
                      "surface-tint": "#0053db",
                      "error": "#EF4444",
                      "on-secondary-fixed-variant": "#5a00c6",
                      "on-tertiary-fixed": "#360f00",
                      "secondary-fixed": "#eaddff",
                      "surface-bright": "#faf8ff",
                      "on-surface-variant": "#434655",
                      "secondary": "#712ae2",
                      "surface-variant": "#dae2fd",
                      "on-primary-fixed-variant": "#003ea8",
                      "success": "#10B981",
                      "surface-container": "#eaedff",
                      "background": "#faf8ff",
                      "outline-variant": "#c3c6d7",
                      "surface-container-highest": "#dae2fd",
                      "inverse-surface": "#283044",
                      "on-primary-fixed": "#00174b",
                      "primary-fixed-dim": "#b4c5ff",
                      "on-error-container": "#93000a",
                      "surface-dim": "#d2d9f4",
                      "border-subtle": "#E2E8F0",
                      "tertiary-container": "#bc4800",
                      "on-tertiary-fixed-variant": "#7d2d00",
                      "surface": "#faf8ff",
                      "primary": "#004ac6",
                      "primary-container": "#2563eb",
                      "on-secondary-fixed": "#25005a",
                      "on-secondary": "#ffffff",
                      "inverse-on-surface": "#eef0ff",
                      "surface-alt": "#F8FAFC",
                      "on-tertiary-container": "#ffede6",
                      "error-container": "#ffdad6",
                      "on-secondary-container": "#fffbff",
                      "tertiary-fixed": "#ffdbcd",
                      "warning": "#F59E0B",
                      "surface-container-high": "#e2e7ff",
                      "outline": "#737686"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "stack-sm": "4px",
                      "section-padding": "32px",
                      "base": "8px",
                      "stack-md": "12px",
                      "stack-lg": "24px",
                      "gutter": "16px",
                      "margin-mobile": "20px"
              },
              "fontFamily": {
                      "label-caps": ["Inter"],
                      "body-lg": ["Inter"],
                      "display-lg": ["Inter"],
                      "headline-md": ["Inter"],
                      "body-sm": ["Inter"],
                      "numeric-data": ["Inter"],
                      "display-lg-mobile": ["Inter"]
              },
              "fontSize": {
                      "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "numeric-data": ["18px", {"lineHeight": "24px", "fontWeight": "500"}],
                      "display-lg-mobile": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
              }
            }
          }
        }
    </script>
<style>
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
            gap: 16px;
        }
        .color-grid {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: none; /* Firefox */
        }
        .color-grid::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-lg antialiased pb-[100px]">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center px-margin-mobile h-16 bg-surface dark:bg-surface-container-lowest">
<button class="mr-4 text-on-surface-variant hover:bg-surface-container-low p-2 rounded-full transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="text-headline-md font-headline-md text-on-surface flex-1">Thêm danh mục</h1>
</header>
<!-- Main Content -->
<main class="mt-16 px-margin-mobile pt-stack-lg flex flex-col gap-stack-lg max-w-lg mx-auto">
<!-- Category Type Selector -->
<section>
<div class="flex p-1 bg-surface-container-low rounded-xl">
<button class="flex-1 py-2 text-center rounded-lg bg-surface shadow-[0_1px_3px_0_rgba(0,0,0,0.1),0_1px_2px_-1px_rgba(0,0,0,0.1)] font-semibold text-primary">Chi tiêu</button>
<button class="flex-1 py-2 text-center rounded-lg text-on-surface-variant font-medium hover:bg-surface-container-highest transition-colors">Thu nhập</button>
</div>
</section>
<!-- Category Name Input -->
<section>
<label class="block text-label-caps font-label-caps text-on-surface-variant mb-stack-sm" for="category_name">Tên danh mục</label>
<input class="w-full bg-surface-alt border border-border-subtle rounded-lg px-4 py-3 text-body-lg font-body-lg text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all" id="category_name" placeholder="VD: Mua sắm, Ăn uống..." type="text"/>
</section>
<!-- Choose Icon -->
<section>
<label class="block text-label-caps font-label-caps text-on-surface-variant mb-stack-md">Chọn biểu tượng</label>
<div class="icon-grid">
<!-- Selected Icon -->
<button class="w-16 h-16 rounded-xl bg-primary text-on-primary flex items-center justify-center shadow-lg transition-transform active:scale-95">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">shopping_cart</span>
</button>
<button class="w-16 h-16 rounded-xl bg-surface text-on-surface-variant border border-border-subtle flex items-center justify-center hover:bg-surface-container-low transition-colors active:scale-95">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 0;">restaurant</span>
</button>
<button class="w-16 h-16 rounded-xl bg-surface text-on-surface-variant border border-border-subtle flex items-center justify-center hover:bg-surface-container-low transition-colors active:scale-95">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 0;">directions_car</span>
</button>
<button class="w-16 h-16 rounded-xl bg-surface text-on-surface-variant border border-border-subtle flex items-center justify-center hover:bg-surface-container-low transition-colors active:scale-95">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 0;">health_and_safety</span>
</button>
<button class="w-16 h-16 rounded-xl bg-surface text-on-surface-variant border border-border-subtle flex items-center justify-center hover:bg-surface-container-low transition-colors active:scale-95">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 0;">movie</span>
</button>
<button class="w-16 h-16 rounded-xl bg-surface text-on-surface-variant border border-border-subtle flex items-center justify-center hover:bg-surface-container-low transition-colors active:scale-95">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 0;">home</span>
</button>
<button class="w-16 h-16 rounded-xl bg-surface text-on-surface-variant border border-border-subtle flex items-center justify-center hover:bg-surface-container-low transition-colors active:scale-95">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 0;">school</span>
</button>
<button class="w-16 h-16 rounded-xl bg-surface text-on-surface-variant border border-border-subtle flex items-center justify-center hover:bg-surface-container-low transition-colors active:scale-95">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 0;">flight</span>
</button>
</div>
</section>
<!-- Color Picker -->
<section>
<label class="block text-label-caps font-label-caps text-on-surface-variant mb-stack-md">Màu sắc</label>
<div class="color-grid">
<!-- Selected Color -->
<button class="w-12 h-12 flex-shrink-0 rounded-full bg-primary flex items-center justify-center ring-4 ring-primary/20">
<span class="material-symbols-outlined text-on-primary" style="font-variation-settings: 'FILL' 1;">check</span>
</button>
<button class="w-12 h-12 flex-shrink-0 rounded-full bg-secondary hover:opacity-80 transition-opacity"></button>
<button class="w-12 h-12 flex-shrink-0 rounded-full bg-success hover:opacity-80 transition-opacity"></button>
<button class="w-12 h-12 flex-shrink-0 rounded-full bg-warning hover:opacity-80 transition-opacity"></button>
<button class="w-12 h-12 flex-shrink-0 rounded-full bg-error hover:opacity-80 transition-opacity"></button>
<button class="w-12 h-12 flex-shrink-0 rounded-full bg-[#14b8a6] hover:opacity-80 transition-opacity"></button>
<button class="w-12 h-12 flex-shrink-0 rounded-full bg-[#ec4899] hover:opacity-80 transition-opacity"></button>
<button class="w-12 h-12 flex-shrink-0 rounded-full bg-[#f97316] hover:opacity-80 transition-opacity"></button>
</div>
</section>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-surface p-margin-mobile border-t border-border-subtle shadow-[0_-4px_12px_rgba(0,0,0,0.05)] z-40 max-w-lg left-1/2 -translate-x-1/2">
<button class="w-full bg-primary text-on-primary py-4 rounded-xl font-headline-md text-headline-md shadow-[0_4px_14px_0_rgba(0,74,198,0.39)] hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">save</span>
            Lưu danh mục
        </button>
</div>
</body></html>
